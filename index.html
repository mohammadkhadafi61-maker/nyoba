            <option value="price-low">Harga: Terendah ke Tertinggi</option>
            <option value="price-high">Harga: Tertinggi ke Terendah</option>

      <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

      </div>

  <!-- Keunggulan & Garansi -->
  <section id="keunggulan" class="py-16 bg-white border-t border-stone-200">
    <div class="container-custom">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
        <div class="lg:col-span-6">
          <span class="text-xs font-bold uppercase tracking-wider 
                        <span class="font-bold text-[11px]">Transfer Bank</span>
              <span class="text-[9px] text-stone-400">BCA / Mandiri</span>
            </label>

        </div>
        <!-- Submit Button -->
        <button type="submit" id="btn-submit-order" class="btn-primary w-full py-3 text-sm font-bold justify-center">
